name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk WakeUpHolmes.apk
          cp wear/build/outputs/apk/release/wear-release.apk WakeUpHolmes-Watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WakeUpHolmes
          path: |
            WakeUpHolmes.apk
            WakeUpHolmes-Watch.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          sleep 3
          gh release create latest WakeUpHolmes.apk WakeUpHolmes-Watch.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Wake Up Holmes (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Phone: download WakeUpHolmes.apk on your phone and open it. Watch: see the README for installing WakeUpHolmes-Watch.apk."
